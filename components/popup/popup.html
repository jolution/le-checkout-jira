<!DOCTYPE html>

<head>
  <title>Jira Branchname Generator</title>
  <link href="/components/popup/popup.css"
        rel="stylesheet"
        type="text/css"/>
  <script defer
          src="/components/popup/popup.js"
          type="module"></script>

  <style>
    :root {
      color-scheme: light dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    .container {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 16px;
    }

    .card {
      max-width: 360px;
      width: 100%;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    p {
      margin: 0 0 16px;
      color: #555;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid currentColor;
    }

    .btn.primary {
      background-color: #0366d6;
      color: #fff;
      border: none;
    }

    @media (prefers-color-scheme: dark) {
      p {
        color: #ccc;
      }
    }
  </style>
</head>

<main>
  <div class="container">
    <div class="card"
         role="dialog"

      <p>Die Optionsseite f&uuml;r die Erweiterung wird gerade entworfen und gebaut. Bis dahin: Testen, Repo einen Stern
        geben und gerne contributen.</p>
      <div>
        <a class="btn primary"
           href="https://github.com/jolution/le-checkout-jira?tab=readme-ov-file#%EF%B8%8F-support"
           target="_blank"
           rel="noopener noreferrer">Repo einen Stern geben</a>
        <a class="btn"
           href="https://github.com/jolution/le-checkout-jira"
           target="_blank"
           rel="noopener noreferrer">Contribute</a>
      </div>
    </div>
  </div>
